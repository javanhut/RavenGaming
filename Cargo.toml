[package]
name = "raven-gaming"
version = "0.1.0"
edition = "2024"
description = "Gaming setup and capture for Raven Linux"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.10.3", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.8.1", features = ["v1_7"] }
glib = "0.21.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# Only for ~/.config/raven/desktop.toml, read to match the desktop look.
toml = "1"
# Only for statvfs, to say how full the drive the games are on is. Already
# in the tree under gtk; naming it here costs nothing and saves shelling
# out to `df` on every refresh.
libc = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
